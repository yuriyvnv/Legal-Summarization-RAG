[project]
name = "Legal-Summarization-RAG"
version = "0.1.0"
description = "Quality-controlled summarization workflow for retrieval in legal RAG systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.3.0",
    "chromadb>=0.6.3",
    "deepeval>=2.3.0",
    "gpustat>=1.1.1",
    "langchain-community>=0.3.16",
    "lm-format-enforcer>=0.10.9",
    "pydantic>=2.10.6",
    "pysqlite3-binary>=0.5.4",
    "python-dotenv>=1.0.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=3.4.1",
    "tensorflow>=2.18.0",
    "tf-keras>=2.18.0",
    "torch>=2.6.0",
    "tqdm>=4.67.1",
    "transformers>=4.48.2",
]
